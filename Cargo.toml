[workspace]
members = ["damsel-core", "damsel-macho", "damsel-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
repository = "https://github.com/theroutercompany/damsel-disasm"
homepage = "https://github.com/theroutercompany/damsel-disasm"

[workspace.dependencies]
assert_cmd = "2.0.17"
axum = { version = "0.8.6", features = ["json", "multipart", "query", "tokio"] }
capstone = { version = "0.14.0", default-features = false, features = ["std", "full", "arch_arm64"] }
clap = { version = "4.5.38", features = ["derive"] }
criterion = { version = "0.5.1", default-features = false }
goblin = "0.10.5"
insta = { version = "1.43.1", features = ["glob"] }
memmap2 = "0.9.5"
object = { version = "0.39.0", features = ["read", "macho"] }
predicates = "3.1.3"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.12"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
webbrowser = "1.0.6"
