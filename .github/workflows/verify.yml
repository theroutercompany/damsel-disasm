name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture-drift:
    name: fixture drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify fixture hashes
        run: ./fixtures/build-fixtures.sh --check

  test-workspace:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  bench-compile:
    name: bench compile (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Bench compile smoke
        run: cargo bench -p damsel-macho --bench decode_bench --no-run

  targeted-macho-fixtures:
    name: targeted macho fixtures (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify export-trie corpus inventory
        run: |
          test -d fixtures/export-trie-corpus
          test -f fixtures/export-trie-corpus/README.md
          test -f fixtures/export-trie-corpus/reexport-same-name.toml
          test -f fixtures/export-trie-corpus/reexport-renamed-symbol.toml
          test -f fixtures/export-trie-corpus/stub-and-resolver.toml
          test -f fixtures/export-trie-corpus/malformed-reexport-ordinal.toml
          test -f fixtures/export-trie-corpus/malformed-stub-resolver-offsets.toml
          test -f fixtures/export-trie-corpus/unknown-flag-bits-regular.toml
      - name: Run targeted malformed/duplicate fixture tests
        run: cargo test -p damsel-macho --test load_matrix --test import_binding_matrix --test disasm_matrix --test export_matrix --test objc_matrix --test slice_inventory_matrix

  decode-throughput-smoke:
    name: decode throughput smoke (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode throughput smoke
        run: cargo bench -p damsel-macho --bench decode_bench -- --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10
