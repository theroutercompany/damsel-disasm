name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture-drift:
    name: fixture drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify fixture hashes
        run: ./fixtures/build-fixtures.sh --check

  test-workspace:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  doctor-compatibility:
    name: doctor compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            expected_host_os: macos
          - os: ubuntu-24.04
            expected_host_os: linux
          - os: ubuntu-24.04-arm
            expected_host_os: linux
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Probe doctor command availability
        id: doctor_probe
        shell: bash
        run: |
          set +e
          cargo run -q -p damsel-cli -- doctor --help > doctor_help.txt 2> doctor_help.err
          status=$?
          set -e
          if [[ ${status} -ne 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping doctor compatibility gates because damsel-cli doctor is not buildable in this revision."
            cat doctor_help.err
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Gate doctor capabilities via --check when available
        if: steps.doctor_probe.outputs.available == 'true'
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
        run: |
          set -euo pipefail
          help_text="$(cat doctor_help.txt)"
          grep -q -- "--check" <<<"${help_text}"
          grep -q -- "macho-analysis" <<<"${help_text}"
          grep -q -- "fixture-rebuild" <<<"${help_text}"
          grep -q -- "fixture-drift-check" <<<"${help_text}"
          grep -q -- "bench-compile" <<<"${help_text}"
          grep -q -- "bench-runtime" <<<"${help_text}"

          cargo run -q -p damsel-cli -- doctor --check "macho-analysis" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "fixture-drift-check" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "bench-compile" --require-status "supported"
          if [[ "${EXPECTED_HOST_OS}" == "macos" ]]; then
            cargo run -q -p damsel-cli -- doctor --check "fixture-rebuild" --require-status "supported"
          fi
          if [[ "${EXPECTED_HOST_OS}" == "linux" && "$(uname -m)" == "aarch64" ]]; then
            cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "supported"
          else
            cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "supported-with-degraded-features"
          fi
      - name: Note deferred doctor gating
        if: steps.doctor_probe.outputs.available != 'true'
        run: |
          echo "Doctor compatibility checks are deferred until the CLI/output lane compiles."
      - name: Validate doctor JSON contract and statuses
        if: steps.doctor_probe.outputs.available == 'true'
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64)
              export EXPECTED_HOST_ARCH="arm64"
              ;;
            x86_64|amd64)
              export EXPECTED_HOST_ARCH="x86_64"
              ;;
            *)
              echo "unexpected host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          cargo run -q -p damsel-cli -- --format json doctor > doctor.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("doctor.json").read_text())
          assert payload["schema_version"] == 1
          assert payload["command"] == "doctor"
          data = payload["data"]

          required_top = {"host", "overall_status", "capabilities", "tools", "issues"}
          assert set(data.keys()) == required_top
          assert set(data["host"].keys()) == {"os", "architecture", "target_triple"}
          capability_keys = set(data["capabilities"].keys())
          assert capability_keys == {
              "macho_analysis",
              "fixture_rebuild",
              "fixture_drift_check",
              "bench_compile",
              "bench_runtime",
              "benchmark",
          }
          assert {
              "xcrun",
              "strip",
              "clang",
              "python3",
              "nm",
              "sdk_path_probe",
              "hash_tools",
              "selected_hash_tool",
          } <= set(data["tools"].keys())
          assert set(data["tools"]["hash_tools"].keys()) == {"sha256sum", "shasum", "openssl"}

          valid = {"supported", "supported-with-degraded-features", "unsupported"}
          assert data["host"]["os"] == os.environ["EXPECTED_HOST_OS"]
          assert data["host"]["architecture"] == os.environ["EXPECTED_HOST_ARCH"]
          assert data["overall_status"] in valid

          for tool_key in ["xcrun", "strip", "clang", "python3", "nm", "sdk_path_probe"]:
              assert set(data["tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"][tool_key]["path"], (str, type(None)))

          for tool_key in ["sha256sum", "shasum", "openssl"]:
              assert set(data["tools"]["hash_tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"]["hash_tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["path"], (str, type(None)))

          for key, capability in data["capabilities"].items():
              assert set(capability.keys()) == {"status", "reasons"}
              assert capability["status"] in valid
              assert isinstance(capability["reasons"], list)
              if capability["status"] != "supported":
                  assert capability["reasons"], f"{key} should include reasons when status={capability['status']}"
          host_os = data["host"]["os"]
          host_arch = data["host"]["architecture"]

          expected_by_key = {
              "macho_analysis": "supported",
              "fixture_rebuild": "supported" if host_os == "macos" else "unsupported",
              "fixture_drift_check": "supported",
              "bench_compile": "supported",
              "bench_runtime": (
                  "supported"
                  if host_os == "linux" and host_arch == "arm64"
                  else "supported-with-degraded-features"
              ),
              "benchmark": (
                  "supported"
                  if host_os == "linux" and host_arch == "arm64"
                  else "supported-with-degraded-features"
              ),
          }

          for key, expected in expected_by_key.items():
              assert data["capabilities"][key]["status"] == expected

          selected_hash_tool = data["tools"]["selected_hash_tool"]
          if selected_hash_tool is None:
              assert all(
                  not data["tools"]["hash_tools"][tool]["usable"]
                  for tool in ["sha256sum", "shasum", "openssl"]
              )
          else:
              assert selected_hash_tool in {"sha256sum", "shasum", "openssl"}
              assert data["tools"]["hash_tools"][selected_hash_tool]["usable"] is True

          statuses = [value["status"] for value in data["capabilities"].values()]
          if any(status == "unsupported" for status in statuses):
              assert data["overall_status"] == "unsupported"
          elif any(status == "supported-with-degraded-features" for status in statuses):
              assert data["overall_status"] == "supported-with-degraded-features"
          else:
              assert data["overall_status"] == "supported"
          PY

  bench-compile:
    name: bench compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Bench compile smoke
        run: cargo bench -p damsel-macho --bench decode_bench --no-run

  targeted-macho-fixtures:
    name: targeted macho fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify export-trie corpus inventory
        run: |
          test -d fixtures/export-trie-corpus
          test -f fixtures/export-trie-corpus/README.md
          test -f fixtures/export-trie-corpus/reexport-same-name.toml
          test -f fixtures/export-trie-corpus/reexport-renamed-symbol.toml
          test -f fixtures/export-trie-corpus/resolver-only.toml
          test -f fixtures/export-trie-corpus/stub-and-resolver.toml
          test -f fixtures/export-trie-corpus/malformed-reexport-ordinal.toml
          test -f fixtures/export-trie-corpus/malformed-stub-resolver-offsets.toml
          test -f fixtures/export-trie-corpus/unknown-flag-bits-regular.toml
      - name: Run targeted malformed/duplicate fixture tests
        run: cargo test -p damsel-macho --test load_matrix --test import_binding_matrix --test disasm_matrix --test export_matrix --test objc_matrix --test slice_inventory_matrix

  decode-bench-unsupported-host-smoke:
    name: decode bench unsupported-host smoke (linux x86_64)
    runs-on: ubuntu-24.04
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode bench unsupported-host runtime path
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p damsel-macho --bench decode_bench -- compatibility::unsupported_host_runtime_skip --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee bench.log
          grep -q "compatibility::unsupported_host_runtime_skip" bench.log

  decode-throughput-smoke:
    name: decode throughput smoke (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode throughput smoke
        run: cargo bench -p damsel-macho --bench decode_bench -- --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10
