name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture-drift:
    name: fixture drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify fixture hashes
        run: ./fixtures/build-fixtures.sh --check

  test-workspace:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  bench-compile:
    name: bench compile (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Bench compile smoke
        run: cargo bench -p damsel-macho --bench decode_bench --no-run

  decode-throughput-smoke:
    name: decode throughput smoke (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode throughput smoke
        run: cargo bench -p damsel-macho --bench decode_bench -- --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10
