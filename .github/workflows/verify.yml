name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-readiness:
    name: release readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check release docs and scripts
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHANGELOG.md
          test -f RELEASE.md
          test -f .github/workflows/release.yml
          test -f .github/release-notes/nightly.md.tmpl
          test -f .github/release-notes/beta.md.tmpl
          test -f bin/release-validate.sh
          test -f bin/release-package.sh
          test -f bin/render-release-notes.sh
          bash -n bin/release-validate.sh
          bash -n bin/release-package.sh
          bash -n bin/render-release-notes.sh
      - name: Check release workflow contract
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          release = YAML.load_file(".github/workflows/release.yml")
          verify = YAML.load_file(".github/workflows/verify.yml")
          triggers = release["on"] || release[true] || {}
          abort("release workflow missing workflow_dispatch trigger") unless triggers.key?("workflow_dispatch")
          abort("release workflow missing schedule trigger") unless triggers.key?("schedule")
          push = triggers["push"] || {}
          tags = push["tags"] || []
          abort("release workflow missing beta tag pattern") unless tags.include?("v*-beta.*")
          jobs = release["jobs"] || {}
          %w[resolve-channel verify-release-inputs build-macos-arm64 package-artifact sign-and-notarize publish-release].each do |job|
            abort("missing release job #{job}") unless jobs.key?(job)
          end
          permissions = release["permissions"] || {}
          abort("release workflow should not use top-level contents: write") if permissions["contents"] == "write"
          publish_permissions = jobs.fetch("publish-release").fetch("permissions", {})
          abort("publish-release must request contents: write") unless publish_permissions["contents"] == "write"
          abort("verify workflow lost release-readiness job") unless (verify["jobs"] || {}).key?("release-readiness")
          puts "workflow-contract-ok"
          RUBY
      - name: Check licensing deferral policy
        run: |
          set -euo pipefail
          if [[ ! -f LICENSE ]]; then
            grep -qi "license" RELEASE.md
            grep -qi "deferred" RELEASE.md
            grep -qi "private" RELEASE.md
          fi
      - name: Validate nightly and beta metadata
        run: |
          set -euo pipefail
          nightly_env="$(mktemp)"
          beta_env="$(mktemp)"
          trap 'rm -f "${nightly_env}" "${beta_env}"' EXIT
          bin/release-validate.sh --channel nightly >"${nightly_env}"
          workspace_version="$(awk '/^\[workspace\.package\]/{flag=1;next}/^\[/{flag=0} flag && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          bin/release-validate.sh --channel beta --tag "v${workspace_version}-beta.1" >"${beta_env}"
          grep -q "^channel=nightly$" "${nightly_env}"
          grep -q "^release_tag=nightly$" "${nightly_env}"
          grep -q "^artifact_name=damsel-nightly-macos-arm64.tar.gz$" "${nightly_env}"
          grep -q "^channel=beta$" "${beta_env}"
          grep -q "^release_tag=v${workspace_version}-beta.1$" "${beta_env}"
          grep -q "^artifact_name=damsel-v${workspace_version}-beta.1-macos-arm64.tar.gz$" "${beta_env}"
          if bin/release-validate.sh --channel beta --tag "v${workspace_version}" >/dev/null 2>&1; then
            echo "expected invalid beta tag format to fail" >&2
            exit 1
          fi
          if bin/release-validate.sh --channel beta --tag "v9.9.9-beta.1" >/dev/null 2>&1; then
            echo "expected mismatched workspace version to fail" >&2
            exit 1
          fi
      - name: Smoke render release notes
        run: |
          set -euo pipefail
          bin/render-release-notes.sh \
            --template .github/release-notes/nightly.md.tmpl \
            --output /tmp/nightly-notes.md \
            --channel nightly \
            --display-version nightly \
            --release-tag nightly \
            --artifact-name damsel-nightly-macos-arm64.tar.gz \
            --archive-root damsel-nightly-macos-arm64 \
            --commit-sha deadbeefdead \
            --run-date-utc 2026-04-13T00:00:00Z \
            --signing-state unsigned
          test -s /tmp/nightly-notes.md

  fixture-drift:
    name: fixture drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify fixture hashes
        run: ./fixtures/build-fixtures.sh --check
      - name: Run fixture parity probes
        run: ./fixtures/tests/build-fixtures-parity.sh

  test-workspace:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  doctor-compatibility:
    name: doctor compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            expected_host_os: macos
            expected_bench_runtime_status: supported-with-degraded-features
            check_fixture_rebuild: "true"
            expect_strict_bench_runtime_failure: "true"
          - os: ubuntu-24.04
            expected_host_os: linux
            expected_bench_runtime_status: supported-with-degraded-features
            check_fixture_rebuild: "false"
            expect_strict_bench_runtime_failure: "true"
          - os: ubuntu-24.04-arm
            expected_host_os: linux
            expected_bench_runtime_status: supported
            check_fixture_rebuild: "false"
            expect_strict_bench_runtime_failure: "false"
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Gate doctor capabilities via --check
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
          EXPECTED_BENCH_RUNTIME_STATUS: ${{ matrix.expected_bench_runtime_status }}
          CHECK_FIXTURE_REBUILD: ${{ matrix.check_fixture_rebuild }}
          EXPECT_STRICT_BENCH_RUNTIME_FAILURE: ${{ matrix.expect_strict_bench_runtime_failure }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          expect_threshold_failure() {
            local label="$1"
            shift
            local stdout_file="${tmpdir}/${label}.stdout"
            local stderr_file="${tmpdir}/${label}.stderr"
            set +e
            "$@" >"${stdout_file}" 2>"${stderr_file}"
            local status=$?
            set -e
            if [[ "${status}" -ne 2 ]]; then
              echo "expected exit code 2 for ${label}, got ${status}" >&2
              cat "${stdout_file}" >&2 || true
              cat "${stderr_file}" >&2 || true
              exit 1
            fi
            grep -Eq "^(host_os:|Host:)" "${stdout_file}" || {
              echo "expected doctor report on stdout for ${label}" >&2
              cat "${stdout_file}" >&2 || true
              exit 1
            }
            if [[ -s "${stderr_file}" ]]; then
              echo "expected empty stderr for ${label} threshold failure" >&2
              cat "${stderr_file}" >&2 || true
              exit 1
            fi
          }

          help_text="$(cargo run -q -p damsel-cli -- doctor --help)"
          grep -q -- "--check" <<<"${help_text}"
          grep -q -- "macho-analysis" <<<"${help_text}"
          grep -q -- "fixture-rebuild" <<<"${help_text}"
          grep -q -- "fixture-drift-check" <<<"${help_text}"
          grep -q -- "bench-compile" <<<"${help_text}"
          grep -q -- "bench-runtime" <<<"${help_text}"

          cargo run -q -p damsel-cli -- doctor --check "macho-analysis" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "fixture-drift-check" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "bench-compile" --require-status "supported"
          if [[ "${CHECK_FIXTURE_REBUILD}" == "true" ]]; then
            cargo run -q -p damsel-cli -- doctor --check "fixture-rebuild" --require-status "supported"
          else
            expect_threshold_failure "fixture_rebuild_strict" \
              cargo run -q -p damsel-cli -- doctor --check "fixture-rebuild" --require-status "supported"
          fi
          cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "${EXPECTED_BENCH_RUNTIME_STATUS}"
          if [[ "${EXPECT_STRICT_BENCH_RUNTIME_FAILURE}" == "true" ]]; then
            expect_threshold_failure "bench_runtime_strict" \
              cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "supported"
          fi
      - name: Validate doctor JSON contract and statuses
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
          EXPECTED_BENCH_RUNTIME_STATUS: ${{ matrix.expected_bench_runtime_status }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64)
              export EXPECTED_HOST_ARCH="arm64"
              ;;
            x86_64|amd64)
              export EXPECTED_HOST_ARCH="x86_64"
              ;;
            *)
              echo "unexpected host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          status_rank() {
            case "$1" in
              supported)
                echo 0
                ;;
              supported-with-degraded-features)
                echo 1
                ;;
              unsupported)
                echo 2
                ;;
              *)
                echo "unexpected status: $1" >&2
                exit 1
                ;;
            esac
          }

          max_status() {
            local left="$1"
            local right="$2"
            if [[ "$(status_rank "${left}")" -ge "$(status_rank "${right}")" ]]; then
              echo "${left}"
            else
              echo "${right}"
            fi
          }

          hash_tool_usable() {
            local tool="$1"
            local path
            path="$(command -v "${tool}" 2>/dev/null || true)"
            if [[ -z "${path}" || ! -x "${path}" ]]; then
              return 1
            fi
            case "${tool}" in
              sha256sum)
                "${path}" /dev/null >/dev/null 2>&1
                ;;
              shasum)
                "${path}" -a 256 /dev/null >/dev/null 2>&1
                ;;
              openssl)
                "${path}" dgst -sha256 /dev/null >/dev/null 2>&1
                ;;
              *)
                return 1
                ;;
            esac
          }

          select_hash_tool() {
            local tool
            for tool in sha256sum shasum openssl; do
              if hash_tool_usable "${tool}"; then
                echo "${tool}"
                return 0
              fi
            done
            return 1
          }

          resolve_xcrun_or_path_tool() {
            local tool="$1"
            local candidate=""
            if command -v xcrun >/dev/null 2>&1; then
              candidate="$(xcrun --find "${tool}" 2>/dev/null || true)"
              if [[ -n "${candidate}" && -x "${candidate}" ]]; then
                echo "${candidate}"
                return 0
              fi
            fi
            candidate="$(command -v "${tool}" 2>/dev/null || true)"
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "${candidate}"
              return 0
            fi
            return 1
          }

          oracle_fixture_rebuild_status() {
            if [[ "${EXPECTED_HOST_OS}" != "macos" ]]; then
              echo "unsupported"
              return 0
            fi

            if ! command -v xcrun >/dev/null 2>&1; then
              echo "unsupported"
              return 0
            fi

            local sdkroot
            if ! sdkroot="$(xcrun --show-sdk-path 2>/dev/null)"; then
              echo "unsupported"
              return 0
            fi
            if [[ -z "${sdkroot}" ]]; then
              echo "unsupported"
              return 0
            fi

            if ! resolve_xcrun_or_path_tool clang >/dev/null; then
              echo "unsupported"
              return 0
            fi
            if ! resolve_xcrun_or_path_tool strip >/dev/null; then
              echo "unsupported"
              return 0
            fi

            if ! command -v python3 >/dev/null 2>&1; then
              echo "unsupported"
              return 0
            fi
            if ! python3 -c 'import sys; sys.exit(0)' >/dev/null 2>&1; then
              echo "unsupported"
              return 0
            fi

            local nm_path
            nm_path="$(command -v nm 2>/dev/null || true)"
            if [[ -z "${nm_path}" || ! -x "${nm_path}" ]]; then
              echo "unsupported"
              return 0
            fi

            echo "supported"
          }

          if [[ "${EXPECTED_HOST_OS}" == "macos" ]] || [[ "${EXPECTED_HOST_OS}" == "linux" && "${EXPECTED_HOST_ARCH}" =~ ^(x86_64|arm64)$ ]]; then
            export ORACLE_MACHO_ANALYSIS_STATUS="supported"
            export ORACLE_BENCH_COMPILE_STATUS="supported"
          else
            export ORACLE_MACHO_ANALYSIS_STATUS="supported-with-degraded-features"
            export ORACLE_BENCH_COMPILE_STATUS="supported-with-degraded-features"
          fi

          export ORACLE_BENCH_RUNTIME_STATUS="${EXPECTED_BENCH_RUNTIME_STATUS}"
          export ORACLE_BENCHMARK_STATUS="$(max_status "${ORACLE_BENCH_COMPILE_STATUS}" "${ORACLE_BENCH_RUNTIME_STATUS}")"

          if ORACLE_SELECTED_HASH_TOOL="$(select_hash_tool 2>/dev/null)"; then
            export ORACLE_SELECTED_HASH_TOOL
            export ORACLE_FIXTURE_DRIFT_STATUS="supported"
          else
            export ORACLE_SELECTED_HASH_TOOL=""
            export ORACLE_FIXTURE_DRIFT_STATUS="unsupported"
          fi

          export ORACLE_FIXTURE_REBUILD_STATUS="$(oracle_fixture_rebuild_status)"
          export ORACLE_POLICY_CHECK_ALL="macho_analysis,fixture_rebuild,fixture_drift_check,bench_compile,bench_runtime"

          cargo run -q -p damsel-cli -- --format json doctor > doctor.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("doctor.json").read_text())
          assert payload["schema_version"] == 1
          assert payload["command"] == "doctor"
          data = payload["data"]

          required_top = {"host", "overall_status", "capabilities", "tools", "issues"}
          assert set(data.keys()) == required_top
          assert set(data["host"].keys()) == {"os", "architecture", "target_triple"}
          assert set(data["capabilities"].keys()) == {
              "macho_analysis",
              "fixture_rebuild",
              "fixture_drift_check",
              "bench_compile",
              "bench_runtime",
              "benchmark",
          }
          assert set(data["tools"].keys()) == {
              "xcrun",
              "strip",
              "clang",
              "python3",
              "nm",
              "sdk_path_probe",
              "hash_tools",
              "selected_hash_tool",
          }
          assert set(data["tools"]["hash_tools"].keys()) == {"sha256sum", "shasum", "openssl"}

          valid = {"supported", "supported-with-degraded-features", "unsupported"}
          assert data["host"]["os"] == os.environ["EXPECTED_HOST_OS"]
          assert data["host"]["architecture"] == os.environ["EXPECTED_HOST_ARCH"]
          assert data["overall_status"] in valid

          for tool_key in ["xcrun", "strip", "clang", "python3", "nm", "sdk_path_probe"]:
              assert set(data["tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"][tool_key]["path"], (str, type(None)))

          for tool_key in ["sha256sum", "shasum", "openssl"]:
              assert set(data["tools"]["hash_tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"]["hash_tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["path"], (str, type(None)))

          for key, capability in data["capabilities"].items():
              assert set(capability.keys()) == {"status", "reasons"}
              assert capability["status"] in valid
              assert isinstance(capability["reasons"], list)
              if capability["status"] != "supported":
                  assert capability["reasons"], f"{key} should include reasons when status={capability['status']}"

          tools = data["tools"]
          capabilities = data["capabilities"]

          selected_hash_tool = tools["selected_hash_tool"]
          expected_selected_hash_tool = os.environ.get("ORACLE_SELECTED_HASH_TOOL") or None
          assert selected_hash_tool == expected_selected_hash_tool

          def severity(status: str) -> int:
              return {"supported": 0, "supported-with-degraded-features": 1, "unsupported": 2}[status]

          def max_status(*statuses: str) -> str:
              return max(statuses, key=severity)

          expected_policy_check_set = [
              key.strip()
              for key in os.environ["ORACLE_POLICY_CHECK_ALL"].split(",")
              if key.strip()
          ]

          policy = payload.get("policy") if isinstance(payload, dict) else None
          if isinstance(policy, dict):
              check_all = policy.get("doctor_check_all")
              if isinstance(check_all, list):
                  assert check_all == expected_policy_check_set

          expected_macho_analysis = os.environ["ORACLE_MACHO_ANALYSIS_STATUS"]
          expected_fixture_rebuild = os.environ["ORACLE_FIXTURE_REBUILD_STATUS"]
          expected_fixture_drift_check = os.environ["ORACLE_FIXTURE_DRIFT_STATUS"]
          expected_bench_compile = os.environ["ORACLE_BENCH_COMPILE_STATUS"]
          expected_bench_runtime = os.environ["ORACLE_BENCH_RUNTIME_STATUS"]
          expected_benchmark = os.environ["ORACLE_BENCHMARK_STATUS"]

          expected_by_key = {
              "macho_analysis": expected_macho_analysis,
              "fixture_rebuild": expected_fixture_rebuild,
              "fixture_drift_check": expected_fixture_drift_check,
              "bench_compile": expected_bench_compile,
              "bench_runtime": expected_bench_runtime,
              "benchmark": expected_benchmark,
          }
          for key, expected in expected_by_key.items():
              assert capabilities[key]["status"] == expected, (key, capabilities[key]["status"], expected)

          assert capabilities["benchmark"]["status"] == max_status(
              capabilities["bench_compile"]["status"],
              capabilities["bench_runtime"]["status"],
          )

          expected_overall = max_status(
              *(capabilities[key]["status"] for key in expected_policy_check_set),
          )
          assert data["overall_status"] == expected_overall

          benchmark_reason_union = []
          seen = set()
          for key in ["bench_compile", "bench_runtime"]:
              for reason in capabilities[key]["reasons"]:
                  reason_key = (reason["code"], reason["message"])
                  if reason_key not in seen:
                      benchmark_reason_union.append(reason)
                      seen.add(reason_key)
          assert capabilities["benchmark"]["reasons"] == benchmark_reason_union

          issues_union = []
          issues_seen = set()
          for key in expected_policy_check_set:
              for reason in capabilities[key]["reasons"]:
                  reason_key = (reason["code"], reason["message"])
                  if reason_key not in issues_seen:
                      issues_union.append(reason)
                      issues_seen.add(reason_key)
          assert data["issues"] == issues_union
          PY

  bench-compile:
    name: bench compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Bench compile smoke
        run: cargo bench -p damsel-macho --bench decode_bench --no-run

  targeted-macho-fixtures:
    name: targeted macho fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify export-trie corpus inventory
        run: |
          test -d fixtures/export-trie-corpus
          test -f fixtures/export-trie-corpus/README.md
          test -f fixtures/export-trie-corpus/reexport-same-name.toml
          test -f fixtures/export-trie-corpus/reexport-renamed-symbol.toml
          test -f fixtures/export-trie-corpus/resolver-only.toml
          test -f fixtures/export-trie-corpus/stub-and-resolver.toml
          test -f fixtures/export-trie-corpus/malformed-reexport-ordinal.toml
          test -f fixtures/export-trie-corpus/malformed-stub-resolver-offsets.toml
          test -f fixtures/export-trie-corpus/unknown-flag-bits-regular.toml
      - name: Run targeted malformed/duplicate fixture tests
        run: cargo test -p damsel-macho --test load_matrix --test import_binding_matrix --test disasm_matrix --test export_matrix --test objc_matrix --test slice_inventory_matrix

  decode-bench-unsupported-host-smoke:
    name: decode bench unsupported-host smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux x86_64
            expected_bench_runtime_status: supported-with-degraded-features
          - os: macos-14
            name: macos arm64
            expected_bench_runtime_status: supported-with-degraded-features
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode bench unsupported-host runtime path
        shell: bash
        env:
          EXPECTED_BENCH_RUNTIME_STATUS: ${{ matrix.expected_bench_runtime_status }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          set +e
          cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "supported" >"${tmpdir}/strict.stdout" 2>"${tmpdir}/strict.stderr"
          strict_status=$?
          set -e
          if [[ "${strict_status}" -ne 2 ]]; then
            echo "expected strict bench-runtime check to fail with exit 2 on unsupported-host smoke lane" >&2
            cat "${tmpdir}/strict.stdout" >&2 || true
            cat "${tmpdir}/strict.stderr" >&2 || true
            exit 1
          fi
          grep -Eq "^(host_os:|Host:)" "${tmpdir}/strict.stdout"
          [[ ! -s "${tmpdir}/strict.stderr" ]]

          cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "${EXPECTED_BENCH_RUNTIME_STATUS}"

          cargo bench -p damsel-macho --bench decode_bench -- compatibility::unsupported_host_runtime_skip --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee bench.log
          grep -Fq "compatibility::unsupported_host_runtime_skip" bench.log
          if grep -Fq "arm64_symbolized::__text" bench.log; then
            echo "unexpected runtime throughput benchmark on unsupported-host smoke lane" >&2
            exit 1
          fi
          if grep -Fq "import_lazy::__text:value_flow_on" bench.log; then
            echo "unexpected value-flow throughput benchmark on unsupported-host smoke lane" >&2
            exit 1
          fi

  decode-throughput-smoke:
    name: decode throughput smoke (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode throughput smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "supported"
          : > bench.log
          cargo bench -p damsel-macho --bench decode_bench -- arm64_symbolized::__text --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee -a bench.log
          cargo bench -p damsel-macho --bench decode_bench -- import_lazy::__text:value_flow_on --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee -a bench.log
          grep -Fq "arm64_symbolized::__text" bench.log
          grep -Fq "import_lazy::__text:value_flow_on" bench.log
