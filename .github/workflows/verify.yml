name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fixture-drift:
    name: fixture drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify fixture hashes
        run: ./fixtures/build-fixtures.sh --check

  test-workspace:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  doctor-compatibility:
    name: doctor compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            expected_host_os: macos
            expected_bench_runtime_status: supported-with-degraded-features
            check_fixture_rebuild: "true"
          - os: ubuntu-24.04
            expected_host_os: linux
            expected_bench_runtime_status: supported-with-degraded-features
            check_fixture_rebuild: "false"
          - os: ubuntu-24.04-arm
            expected_host_os: linux
            expected_bench_runtime_status: supported
            check_fixture_rebuild: "false"
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Gate doctor capabilities via --check
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
          EXPECTED_BENCH_RUNTIME_STATUS: ${{ matrix.expected_bench_runtime_status }}
          CHECK_FIXTURE_REBUILD: ${{ matrix.check_fixture_rebuild }}
        run: |
          set -euo pipefail
          help_text="$(cargo run -q -p damsel-cli -- doctor --help)"
          grep -q -- "--check" <<<"${help_text}"
          grep -q -- "macho-analysis" <<<"${help_text}"
          grep -q -- "fixture-rebuild" <<<"${help_text}"
          grep -q -- "fixture-drift-check" <<<"${help_text}"
          grep -q -- "bench-compile" <<<"${help_text}"
          grep -q -- "bench-runtime" <<<"${help_text}"

          cargo run -q -p damsel-cli -- doctor --check "macho-analysis" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "fixture-drift-check" --require-status "supported"
          cargo run -q -p damsel-cli -- doctor --check "bench-compile" --require-status "supported"
          if [[ "${CHECK_FIXTURE_REBUILD}" == "true" ]]; then
            cargo run -q -p damsel-cli -- doctor --check "fixture-rebuild" --require-status "supported"
          fi
          cargo run -q -p damsel-cli -- doctor --check "bench-runtime" --require-status "${EXPECTED_BENCH_RUNTIME_STATUS}"
      - name: Validate doctor JSON contract and statuses
        env:
          EXPECTED_HOST_OS: ${{ matrix.expected_host_os }}
          EXPECTED_BENCH_RUNTIME_STATUS: ${{ matrix.expected_bench_runtime_status }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64)
              export EXPECTED_HOST_ARCH="arm64"
              ;;
            x86_64|amd64)
              export EXPECTED_HOST_ARCH="x86_64"
              ;;
            *)
              echo "unexpected host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          cargo run -q -p damsel-cli -- --format json doctor > doctor.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("doctor.json").read_text())
          assert payload["schema_version"] == 1
          assert payload["command"] == "doctor"
          data = payload["data"]

          required_top = {"host", "overall_status", "capabilities", "tools", "issues"}
          assert set(data.keys()) == required_top
          assert set(data["host"].keys()) == {"os", "architecture", "target_triple"}
          assert set(data["capabilities"].keys()) == {
              "macho_analysis",
              "fixture_rebuild",
              "fixture_drift_check",
              "bench_compile",
              "bench_runtime",
              "benchmark",
          }
          assert set(data["tools"].keys()) == {
              "xcrun",
              "strip",
              "clang",
              "python3",
              "nm",
              "sdk_path_probe",
              "hash_tools",
              "selected_hash_tool",
          }
          assert set(data["tools"]["hash_tools"].keys()) == {"sha256sum", "shasum", "openssl"}

          valid = {"supported", "supported-with-degraded-features", "unsupported"}
          assert data["host"]["os"] == os.environ["EXPECTED_HOST_OS"]
          assert data["host"]["architecture"] == os.environ["EXPECTED_HOST_ARCH"]
          assert data["overall_status"] in valid

          for tool_key in ["xcrun", "strip", "clang", "python3", "nm", "sdk_path_probe"]:
              assert set(data["tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"][tool_key]["path"], (str, type(None)))

          for tool_key in ["sha256sum", "shasum", "openssl"]:
              assert set(data["tools"]["hash_tools"][tool_key].keys()) == {"detected", "usable", "path"}
              assert isinstance(data["tools"]["hash_tools"][tool_key]["detected"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["usable"], bool)
              assert isinstance(data["tools"]["hash_tools"][tool_key]["path"], (str, type(None)))

          for key, capability in data["capabilities"].items():
              assert set(capability.keys()) == {"status", "reasons"}
              assert capability["status"] in valid
              assert isinstance(capability["reasons"], list)
              if capability["status"] != "supported":
                  assert capability["reasons"], f"{key} should include reasons when status={capability['status']}"
          host_os = data["host"]["os"]
          host_arch = data["host"]["architecture"]
          tools = data["tools"]
          capabilities = data["capabilities"]

          priority = ["sha256sum", "shasum", "openssl"]
          usable_hash_tools = [tool for tool in priority if tools["hash_tools"][tool]["usable"]]
          selected_hash_tool = tools["selected_hash_tool"]
          expected_selected_hash_tool = usable_hash_tools[0] if usable_hash_tools else None
          assert selected_hash_tool == expected_selected_hash_tool

          def severity(status: str) -> int:
              return {"supported": 0, "supported-with-degraded-features": 1, "unsupported": 2}[status]

          def max_status(*statuses: str) -> str:
              return max(statuses, key=severity)

          host_is_primary_supported = (
              host_os == "macos"
              or (host_os == "linux" and host_arch in {"x86_64", "arm64"})
          )
          expected_macho_analysis = (
              "supported" if host_is_primary_supported else "supported-with-degraded-features"
          )

          required_fixture_tools = ["xcrun", "clang", "strip", "python3", "nm"]
          fixture_tools_usable = all(
              tools[tool]["detected"] and tools[tool]["usable"] for tool in required_fixture_tools
          )
          expected_fixture_rebuild = (
              "supported"
              if host_os == "macos" and fixture_tools_usable and tools["sdk_path_probe"]["usable"]
              else "unsupported"
          )
          expected_fixture_drift_check = "supported" if expected_selected_hash_tool else "unsupported"
          expected_bench_compile = (
              "supported" if host_is_primary_supported else "supported-with-degraded-features"
          )
          expected_bench_runtime = os.environ["EXPECTED_BENCH_RUNTIME_STATUS"]
          expected_benchmark = max_status(expected_bench_compile, expected_bench_runtime)

          expected_by_key = {
              "macho_analysis": expected_macho_analysis,
              "fixture_rebuild": expected_fixture_rebuild,
              "fixture_drift_check": expected_fixture_drift_check,
              "bench_compile": expected_bench_compile,
              "bench_runtime": expected_bench_runtime,
              "benchmark": expected_benchmark,
          }
          for key, expected in expected_by_key.items():
              assert capabilities[key]["status"] == expected, (key, capabilities[key]["status"], expected)

          assert capabilities["benchmark"]["status"] == max_status(
              capabilities["bench_compile"]["status"],
              capabilities["bench_runtime"]["status"],
          )

          expected_overall = max_status(
              capabilities["macho_analysis"]["status"],
              capabilities["fixture_rebuild"]["status"],
              capabilities["fixture_drift_check"]["status"],
              capabilities["bench_compile"]["status"],
              capabilities["bench_runtime"]["status"],
          )
          assert data["overall_status"] == expected_overall

          benchmark_reason_union = []
          seen = set()
          for key in ["bench_compile", "bench_runtime"]:
              for reason in capabilities[key]["reasons"]:
                  reason_key = (reason["code"], reason["message"])
                  if reason_key not in seen:
                      benchmark_reason_union.append(reason)
                      seen.add(reason_key)
          assert capabilities["benchmark"]["reasons"] == benchmark_reason_union

          issues_union = []
          issues_seen = set()
          for key in [
              "macho_analysis",
              "fixture_rebuild",
              "fixture_drift_check",
              "bench_compile",
              "bench_runtime",
          ]:
              for reason in capabilities[key]["reasons"]:
                  reason_key = (reason["code"], reason["message"])
                  if reason_key not in issues_seen:
                      issues_union.append(reason)
                      issues_seen.add(reason_key)
          assert data["issues"] == issues_union
          PY

  bench-compile:
    name: bench compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Bench compile smoke
        run: cargo bench -p damsel-macho --bench decode_bench --no-run

  targeted-macho-fixtures:
    name: targeted macho fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify export-trie corpus inventory
        run: |
          test -d fixtures/export-trie-corpus
          test -f fixtures/export-trie-corpus/README.md
          test -f fixtures/export-trie-corpus/reexport-same-name.toml
          test -f fixtures/export-trie-corpus/reexport-renamed-symbol.toml
          test -f fixtures/export-trie-corpus/resolver-only.toml
          test -f fixtures/export-trie-corpus/stub-and-resolver.toml
          test -f fixtures/export-trie-corpus/malformed-reexport-ordinal.toml
          test -f fixtures/export-trie-corpus/malformed-stub-resolver-offsets.toml
          test -f fixtures/export-trie-corpus/unknown-flag-bits-regular.toml
      - name: Run targeted malformed/duplicate fixture tests
        run: cargo test -p damsel-macho --test load_matrix --test import_binding_matrix --test disasm_matrix --test export_matrix --test objc_matrix --test slice_inventory_matrix

  decode-bench-unsupported-host-smoke:
    name: decode bench unsupported-host smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux x86_64
          - os: macos-14
            name: macos arm64
    runs-on: ${{ matrix.os }}
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode bench unsupported-host runtime path
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p damsel-macho --bench decode_bench -- compatibility::unsupported_host_runtime_skip --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee bench.log
          grep -q "compatibility::unsupported_host_runtime_skip" bench.log

  decode-throughput-smoke:
    name: decode throughput smoke (linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: fixture-drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Decode throughput smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p damsel-macho --bench decode_bench -- arm64_symbolized::__text --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 | tee bench.log
          grep -q "arm64_symbolized::__text" bench.log
          if grep -q "compatibility::unsupported_host_runtime_skip" bench.log; then
            echo "unexpected unsupported-host runtime skip in linux arm64 throughput smoke" >&2
            exit 1
          fi
